<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Music Player</title>
    <link rel="stylesheet" href="style-2.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Background Animation -->
        <div class="bg-animation">
            <div class="blob blob-1"></div>
            <div class="blob blob-2"></div>
            <div class="blob blob-3"></div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Music Player -->
            <div class="music-player">
                <!-- Album Cover -->
                <div class="album-cover">
                    <img id="album-art" src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=500&h=500&fit=crop" alt="Album Cover">
                    <div class="playing-animation">
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>

                <!-- Song Info -->
                <div class="song-info">
                    <h2 id="song-title">Midnight Dreams</h2>
                    <p id="artist-name">Luna Eclipse</p>
                </div>

                <!-- Progress Bar -->
                <div class="progress-container">
                    <div class="time current-time" id="current-time">0:00</div>
                    <div class="progress-bar">
                        <div class="progress" id="progress"></div>
                        <div class="progress-dot" id="progress-dot"></div>
                    </div>
                    <div class="time total-time" id="total-time">0:00</div>
                </div>

                <!-- Controls -->
                <div class="controls">
                    <button class="control-btn" id="prev-btn">
                        <i class="fas fa-backward"></i>
                    </button>
                    <button class="control-btn play-btn" id="play-btn">
                        <i class="fas fa-play"></i>
                    </button>
                    <button class="control-btn" id="next-btn">
                        <i class="fas fa-forward"></i>
                    </button>
                </div>

                <!-- Volume Control -->
                <div class="volume-container">
                    <i class="fas fa-volume-up volume-icon"></i>
                    <input type="range" class="volume-slider" id="volume-slider" min="0" max="100" value="70">
                    <span class="volume-percentage" id="volume-percentage">70%</span>
                </div>
            </div>

            <!-- Playlist Sidebar -->
            <div class="playlist-sidebar">
                <div class="playlist-header">
                    <h3>Playlist</h3>
                    <span class="playlist-count" id="playlist-count">5 songs</span>
                </div>
                <div class="search-container">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" id="search-input" class="search-input" placeholder="Search songs...">
                </div>
                <div class="playlist" id="playlist">
                    <!-- Playlist items will be generated by JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden Audio Element -->
    <audio id="audio-player"></audio>

    <script src="script.js"></script>
</body>
</html>
